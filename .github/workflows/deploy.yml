name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site lives under /<repository-name>. A user site (<name>.github.io) and any site
      # with its own custom domain live at the root, so they need no base path.
      # Set the repository variable CUSTOM_DOMAIN (any non-empty value) when you use a custom domain.
      - name: Work out the base path
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$CUSTOM_DOMAIN" || "$REPO" == *.github.io ]]; then echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"; else echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"; fi

      - run: npm run build
        env:
          # Both values are public by design (the database rules protect the data).
          # Set them under Settings > Secrets and variables > Actions > Variables.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
